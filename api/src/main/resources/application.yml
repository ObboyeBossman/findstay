server:
  port: ${PORT:8080}

spring:
  application:
    name: findstay-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/findstay}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost:9999/.well-known/jwks.json}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

findstay:
  auth:
    issuer: ${SUPABASE_JWT_ISSUER:}
    supabase-url: ${SUPABASE_URL:}
    supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  pii:
    encryption-key: ${FINDSTAY_PII_ENCRYPTION_KEY:}  # 256-bit AES key, Base64-encoded (NFR-28, TA-09)
  cors:
    allowed-origins: http://localhost:3000,https://findstay-web-staging.obboyebossman.workers.dev
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-bucket: ${R2_PUBLIC_BUCKET:findstay-property-images}
    private-bucket: ${R2_PRIVATE_BUCKET:findstay-verification-docs}
    public-cdn-url: ${R2_PUBLIC_CDN_URL:}
  notifications:
    email:
      provider: ${NOTIFICATION_EMAIL_PROVIDER:log}
    sms:
      enabled: ${NOTIFICATION_SMS_ENABLED:false}
      provider: ${NOTIFICATION_SMS_PROVIDER:noop}
    retry-scheduler-enabled: ${NOTIFICATION_RETRY_SCHEDULER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info   # info = build identity, for deploy verification (S1-01-T11)
  endpoint:
    health:
      show-components: always  # component statuses on /actuator/health; details stay private
