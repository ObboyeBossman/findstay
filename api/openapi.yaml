openapi: 3.1.0
info:
  title: FindStay API
  version: 1.0.0-draft
  summary: FindStay Sprint 1 (Release R1) API contract for guests, owners/staff, and admins.
  description: |
    The Sprint 1 API agreement for FindStay — the contract frontend and backend
    build against (task `S1-01-T6`). Human-readable companion:
    `docs/design/backend-architecture.md`. Decisions: `DEC-S1-01/A/B/C` in
    `docs/decisions/dec-s1-01-t6-backend-contracts.md`.

    **Status of this file (DEC-S1-01/C):** hand-authored design contract while the
    API modules are placeholders. Once controllers exist, this file becomes the
    generated output of the `springdoc-openapi-maven-plugin`
    (`mvn springdoc-openapi:generate`) and is committed on every release tag so
    CI can diff tag-to-tag (`C3`). Hand-authoring stops at that point.

    Conventions every operation follows:

    * **Auth (TA-01, TA-02, P-09):** the browser signs in only through Supabase
      Auth; every business-data call carries `Authorization: Bearer <Supabase
      JWT>`, validated via JWKS. Sign-up, OTP, and password reset are NOT API
      endpoints (see DEC-S1-01/A).
    * **Provisioning (DEC-S1-01/A):** after account confirmation the client calls
      `POST /auth/provision` (idempotent) to create the local account record.
    * **OrgScope (J-06, BRL-04):** operations tagged `x-org-scope: true` enforce
      `organization_id` isolation derived from the caller's membership — never
      from a client-supplied identifier. Cross-organisation reads return 404.
    * **Money:** integer pesewas (`250000` = GH₵2,500.00), currency always GHS.
      No decimal money anywhere (NFR-08).
    * **Time:** all timestamps are ISO-8601 UTC; screens display Africa/Accra
      (NFR-52).
    * **Errors:** one shape (`ApiError`), stable `code` values — see
      `ErrorCode` in the shared kernel (T7, PR #37). Clients switch on `code`.
    * **Pagination:** `limit` (default 20, max 100) + `offset`; lists return
      `{ items, total }`.
    * **Audit:** operations tagged `x-audit-event` write an append-only
      `audit.audit_log` record (BRL-13, BRL-16, NFR-66).
    * **Compatibility (C3):** additive only — endpoints and fields are never
      removed or renamed once released.
servers:
  - url: https://findstay-api.onrender.com
    description: Staging (Render). Resolve the production URL at release.
  - url: http://localhost:8080
    description: Local development.
security:
  - bearerAuth: []
tags:
  - name: identity
    description: Account provisioning, session context, and profile (module `identity`).
  - name: notification
    description: Per-user notification channel preferences (module `notification`).
  - name: verification
    description: Privacy consent and owner verification (module `verification`).
  - name: organization
    description: Owner organisation, staff invitations, dashboard (module `organization`).
  - name: listing-owner
    description: Owner-side property, unit, and photo management (module `listing`).
  - name: availability
    description: Unit availability calendar and owner date blocks (module `availability`).
  - name: admin
    description: Platform administration — review queue, users, settings, audit (module `admin`).
  - name: listing-public
    description: Anonymous guest reads — featured, search, details (module `listing`).

paths:
  /api/v1/auth/provision:
    post:
      tags: [identity]
      operationId: provisionAccount
      summary: Provision the local account for the authenticated user (idempotent)
      description: |
        Called by the React client immediately after Supabase confirms sign-up
        (OTP or email link), and safely retryable at any time. Creates the
        `user_account` row (plus the default Guest role membership) for the
        JWT subject if it does not exist; returns the session context either
        way. Records `user.registered` on first creation (DEC-S1-01/A).
      security:
        - bearerAuth: []
      x-module: identity
      x-audit-event: user.registered
      responses:
        "200":
          description: Account provisioned (or already existed) — session context returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContext"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/me:
    get:
      tags: [identity]
      operationId: getSessionContext
      summary: Load session context — profile, roles, memberships, consent state
      description: |
        The app-start bootstrap after Supabase sign-in. Auto-provisions a missing
        account (idempotent, DEC-S1-01/A), reports whether the privacy policy
        version requires re-consent (NFR-36), and returns the role memberships
        used by the portal picker (BRL-02, P-04). Records `auth.login_success`
        for the first call of a session.
      security:
        - bearerAuth: []
      x-module: identity
      x-audit-event: auth.login_success
      responses:
        "200":
          description: Session context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContext"
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [identity]
      operationId: updateProfile
      summary: Update the signed-in user's profile
      security:
        - bearerAuth: []
      x-module: identity
      x-audit-event: user.profile_updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/notifications/preferences:
    get:
      tags: [notification]
      operationId: getNotificationPreferences
      summary: Read the signed-in user's notification channel preferences
      security:
        - bearerAuth: []
      x-module: notification
      responses:
        "200":
          description: Current preferences (email, sms, in-app) per notification kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [notification]
      operationId: replaceNotificationPreferences
      summary: Replace the signed-in user's notification channel preferences
      security:
        - bearerAuth: []
      x-module: notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Stored preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/notifications:
    get:
      tags: [notification]
      operationId: listMyNotifications
      summary: List the signed-in user's in-app notifications (inbox + bell badge)
      description: |
        Serves the Notification Bell & Inbox (S1-10-T1/T6, FR-71). The bell
        badge reads `unreadCount`; the inbox lists newest-first. Polling in
        R1 — no push channel (SSE/WebSocket) before Sprint 3 (review agenda §8).
      security:
        - bearerAuth: []
      x-module: notification
      parameters:
        - $ref: "#/components/parameters/UnreadOnly"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Notification page plus the bell's unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/notifications/{notificationId}/read:
    post:
      tags: [notification]
      operationId: markNotificationRead
      summary: Mark one in-app notification as read
      security:
        - bearerAuth: []
      x-module: notification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: The updated notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/notifications/read-all:
    post:
      tags: [notification]
      operationId: markAllNotificationsRead
      summary: Mark every unread in-app notification as read (inbox "mark all")
      security:
        - bearerAuth: []
      x-module: notification
      responses:
        "200":
          description: Summary of the bulk update.
          content:
            application/json:
              schema:
                type: object
                required: [markedRead]
                properties:
                  markedRead: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/consents/latest:
    get:
      tags: [verification]
      operationId: getLatestConsentState
      summary: Latest privacy policy version and the user's acceptance of it
      description: |
        Drives the re-consent gate (SCR-06C, NFR-36). Returns the current policy
        version and `acceptedAt: null` when the user must re-consent.
      security:
        - bearerAuth: []
      x-module: verification
      responses:
        "200":
          description: Latest consent state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/consents:
    post:
      tags: [verification]
      operationId: recordConsent
      summary: Record acceptance of a privacy policy version (Ghana Act 843)
      security:
        - bearerAuth: []
      x-module: verification
      x-audit-event: consent.recorded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentAcceptance"
      responses:
        "201":
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/owner/dashboard:
    get:
      tags: [organization]
      operationId: getOwnerDashboard
      summary: Owner/staff dashboard — verification status, listing counts, alerts
      security:
        - bearerAuth: []
      x-module: organization
      x-org-scope: true
      responses:
        "200":
          description: Dashboard summary for the caller's active organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDashboard"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/owner/org:
    get:
      tags: [organization]
      operationId: getOrganization
      summary: Read the caller's organisation profile
      security:
        - bearerAuth: []
      x-module: organization
      x-org-scope: true
      responses:
        "200":
          description: Organisation profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [organization]
      operationId: updateOrganization
      summary: Update the caller's organisation profile
      security:
        - bearerAuth: []
      x-module: organization
      x-org-scope: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/owner/invitations:
    post:
      tags: [organization]
      operationId: inviteStaff
      summary: Invite a staff member by email with a role and assigned properties
      description: |
        Sends the invitation email containing `/owner/invitations?token=…`
        (BRL-17). Only the primary Owner can invite (settled answer to T1 open
        decision 2).
      security:
        - bearerAuth: []
      x-module: organization
      x-org-scope: true
      x-audit-event: org.staff_invited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: Invitation created and sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Email already a member or already invited (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      tags: [organization]
      operationId: listInvitations
      summary: List the organisation's outstanding staff invitations with status
      description: |
        Feeds the SCR-08 staff list: pending and expired invitations with
        status and expiry, alongside members (S1-07 "invite staff and grant or
        revoke per-property permissions" — the owner must see current state).
      security:
        - bearerAuth: []
      x-module: organization
      x-org-scope: true
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Invitation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/owner/members:
    get:
      tags: [organization]
      operationId: listMembers
      summary: List the organisation's members with roles and property scopes
      description: |
        The SCR-08 staff list ("No staff invited yet" empty state). Each member
        carries their role and the properties their membership is scoped to
        (`membership_permission`, UR-PS01).
      security:
        - bearerAuth: []
      x-module: organization
      x-org-scope: true
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Member page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/owner/members/{userId}:
    patch:
      tags: [organization]
      operationId: updateMember
      summary: Update a member's role and assigned properties (grant/revoke access)
      description: |
        S1-07 acceptance: "An owner can invite staff and grant or revoke
        per-property permissions." `propertyIds` is a replace operation — the
        complete new scope. Only the primary Owner can change members
        (BRL-05). Produces the `org.staff_role_updated` audit event T3 names
        on SCR-08.
      security:
        - bearerAuth: []
      x-module: organization
      x-org-scope: true
      x-audit-event: org.staff_role_updated
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Cannot change the organisation's primary owner (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/invitations/{token}:
    get:
      tags: [organization]
      operationId: viewInvitation
      summary: View an invitation by token (org, assigned properties, role)
      description: Token-authorised — no bearer JWT required. 422 when the token is known but expired or revoked.
      security: []
      x-module: organization
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Invitation details for the acceptance screen (SCR-08B).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationView"
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invitation expired or revoked (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/invitations/{token}/accept:
    post:
      tags: [organization]
      operationId: acceptInvitation
      summary: Accept a staff invitation and join the organisation
      description: |
        The invitee authenticates through Supabase first (sign in or set
        password), then calls this endpoint with their bearer JWT. Membership is
        created scoped to the assigned properties (UR-PS01).
      security:
        - bearerAuth: []
      x-module: organization
      x-audit-event: org.staff_invite_accepted
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Accepted — returns the organisation and the new memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAccepted"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invitation expired, revoked, or already accepted (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/owner/verification/presign:
    post:
      tags: [verification]
      operationId: presignVerificationDocument
      summary: Authorise and issue a short-lived upload URL for a verification document
      description: |
        Two-step upload step 1 (DEC §4.6): the API validates document type,
        MIME type, and size (<= 5 MB, NFR-17, TA-13), then returns a short-lived
        pre-signed PUT URL for the private R2 bucket `findstay-verification-docs`
        (NFR-24). The browser uploads the bytes straight to R2 (step 2).
        Ghana Card numbers are never uploaded as documents metadata — they are
        submitted encrypted with `verification/submit`.
      security:
        - bearerAuth: []
      x-module: verification
      x-org-scope: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentPresignRequest"
      responses:
        "201":
          description: Pre-signed upload URL issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/owner/verification/submit:
    post:
      tags: [verification]
      operationId: submitVerification
      summary: Submit the organisation's verification case for admin review
      description: |
        Submits Ghana Card, ownership proof, and GTA licence (P-12). Rejected
        documents can be re-uploaded and re-submitted individually. Notifies the
        admin review queue (BRL-17). Only the primary Owner can submit.
      security:
        - bearerAuth: []
      x-module: verification
      x-org-scope: true
      x-audit-event: verification.submitted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationSubmit"
      responses:
        "202":
          description: Case submitted — per-document status now Pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCase"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Case already under active review (CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Required document missing or already approved (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/owner/verification:
    get:
      tags: [verification]
      operationId: getVerificationStatus
      summary: Read the organisation's verification case with per-document status
      security:
        - bearerAuth: []
      x-module: verification
      x-org-scope: true
      responses:
        "200":
          description: Verification case (overall + per-document status with fix notes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCase"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/owner/properties:
    get:
      tags: [listing-owner]
      operationId: listOwnerProperties
      summary: List the organisation's properties with status badges
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      parameters:
        - name: status
          in: query
          description: Filter by listing status.
          schema:
            $ref: "#/components/schemas/ListingStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Property list for the organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [listing-owner]
      operationId: createProperty
      summary: Create a property draft
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      x-audit-event: listing.draft_saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyCreate"
      responses:
        "201":
          description: Draft property created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/owner/properties/{propertyId}:
    get:
      tags: [listing-owner]
      operationId: getOwnerProperty
      summary: Read one property with units, photos, and submission status
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [listing-owner]
      operationId: updateProperty
      summary: Update a property draft (auto-save) or pause/reactivate the listing
      description: |
        Field updates auto-save drafts. Setting `status` to `PAUSED` or `ACTIVE`
        pauses or reactivates a published listing (FR-13).
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      x-audit-event: listing.draft_saved, listing.paused, listing.reactivated
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Listing locked under active admin review — edits rejected (CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/owner/properties/{propertyId}/preview:
    get:
      tags: [listing-owner]
      operationId: previewProperty
      summary: Preview the property exactly as guests will see it
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Guest-view of the property (same shape as the public detail).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyPublicDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/owner/properties/{propertyId}/submit:
    post:
      tags: [listing-owner]
      operationId: submitProperty
      summary: Submit the property for admin review
      description: Notifies the admin review queue (BRL-17). Minimum listing
        information must be complete (BRL-06).
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      x-audit-event: listing.submitted
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "202":
          description: Submitted — status now Pending Review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Property locked under active review (CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Minimum listing information incomplete (BUSINESS_RULE_VIOLATION, BRL-06).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/owner/properties/{propertyId}/units:
    post:
      tags: [listing-owner]
      operationId: addUnit
      summary: Add a bookable unit (room, apartment, suite) with its own rate
      description: Every unit is individually tracked with its own rate and
        calendar (P-02). Rates are integer pesewas.
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      x-audit-event: unit.created
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "201":
          description: Unit created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/owner/properties/{propertyId}/units/{unitId}:
    patch:
      tags: [listing-owner]
      operationId: updateUnit
      summary: Update a unit (rate, capacity, billing period, category)
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      x-audit-event: unit.updated
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/UnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "200":
          description: Updated unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [listing-owner]
      operationId: deleteUnit
      summary: Remove a unit
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/UnitId"
      responses:
        "204": { description: Unit removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Unit has availability blocks or future bookings attached (CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/owner/properties/{propertyId}/photos/presign:
    post:
      tags: [listing-owner]
      operationId: presignPropertyPhoto
      summary: Authorise and issue a short-lived upload URL for a property photo
      description: |
        Validates MIME type and size (<= 5 MB) and enforces the 10-photo cap
        (FR-14). Upload goes to the public R2 bucket `findstay-property-images`
        and is served as optimised WebP via the CDN (TA-13).
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoPresignRequest"
      responses:
        "201":
          description: Pre-signed upload URL issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Photo cap of 10 already reached (BUSINESS_RULE_VIOLATION, FR-14).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/owner/properties/{propertyId}/photos:
    put:
      tags: [listing-owner]
      operationId: reorderPhotos
      summary: Reorder photos and set the cover photo
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      x-audit-event: listing.photos_updated
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoOrder"
      responses:
        "200":
          description: Stored photo order; first item is the cover.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/owner/properties/{propertyId}/photos/{photoId}:
    delete:
      tags: [listing-owner]
      operationId: deletePhoto
      summary: Delete a photo (and promote the next one to cover if needed)
      security:
        - bearerAuth: []
      x-module: listing
      x-org-scope: true
      x-audit-event: listing.photos_updated
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204": { description: Photo removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/owner/units/{unitId}/availability:
    get:
      tags: [availability]
      operationId: getUnitAvailability
      summary: Month calendar for a unit — Available / Owner-Blocked (Booked is Sprint 2+)
      security:
        - bearerAuth: []
      x-module: availability
      x-org-scope: true
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - name: month
          in: query
          required: true
          description: Calendar month in Ghana time, `YYYY-MM`.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            examples: ["2026-11"]
      responses:
        "200":
          description: Day-by-day availability for the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityCalendar"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/owner/units/{unitId}/blocks:
    post:
      tags: [availability]
      operationId: createDateBlock
      summary: Block a date range on a unit (owner block)
      description: |
        Dates are interpreted as `Africa/Accra` days and stored as a UTC
        `tstzrange`. PostgreSQL's `btree_gist` exclusion constraint rejects
        overlapping blocks at the database level (P-02) — the API surfaces that
        as 409 CONFLICT.
      security:
        - bearerAuth: []
      x-module: availability
      x-org-scope: true
      x-audit-event: availability.block_created
      parameters:
        - $ref: "#/components/parameters/UnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityBlockInput"
      responses:
        "201":
          description: Block created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityBlock"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Dates overlap an existing block (CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/owner/units/{unitId}/blocks/{blockId}:
    delete:
      tags: [availability]
      operationId: deleteDateBlock
      summary: Remove an owner date block
      security:
        - bearerAuth: []
      x-module: availability
      x-org-scope: true
      x-audit-event: availability.block_removed
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - $ref: "#/components/parameters/BlockId"
      responses:
        "204": { description: Block removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/dashboard:
    get:
      tags: [admin]
      operationId: getAdminDashboard
      summary: Admin dashboard — queue sizes, user stats, recent alerts
      security:
        - bearerAuth: []
      x-module: admin
      responses:
        "200":
          description: Admin dashboard summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/reviews:
    get:
      tags: [admin]
      operationId: listReviewQueue
      summary: Review queue — pending owner verifications and property submissions
      security:
        - bearerAuth: []
      x-module: admin
      parameters:
        - name: status
          in: query
          description: Filter the queue; defaults to pending.
          schema:
            type: string
            enum: [pending, decided]
            default: pending
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Review queue page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/reviews/{reviewId}:
    get:
      tags: [admin]
      operationId: getReviewDetail
      summary: Inspect one review — listing details, photos, per-document verification
      description: Verification documents are read through short-lived pre-signed
        GET URLs issued after authorisation (NFR-24).
      security:
        - bearerAuth: []
      x-module: admin
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Review detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/reviews/{reviewId}/decision:
    post:
      tags: [admin]
      operationId: decideReview
      summary: Approve, request corrections, or reject a review item
      description: |
        Three-way decision (FR-88). Corrections require a fix list; rejection
        requires a reason (both validated, else 422). Notifies the owner by
        email + in-app (BRL-17).
      security:
        - bearerAuth: []
      x-module: admin
      x-audit-event: verification.approved, verification.rejected, listing.approved, listing.corrections_requested, listing.rejected
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Decision recorded; owner notified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDetail"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already reviewed by another admin (CONFLICT) — refresh the queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Corrections fix list or rejection reason missing (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Search platform users with roles and account status
      security:
        - bearerAuth: []
      x-module: admin
      parameters:
        - name: q
          in: query
          description: Search by name or email.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: User page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createUser
      summary: Create a user account (admin-provisioned) and send the invite email
      description: |
        S1-16-T3: "search, create, suspend, restore". The API provisions the
        account server-side through Supabase's service-role Admin API (invite
        email), creates the `user_account` + role membership, and records
        `user.admin_created` with the mandatory reason. T3 draws no screen for
        this — story-level addition (see cross-check §6).
      security:
        - bearerAuth: []
      x-module: admin
      x-audit-event: user.admin_created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Account created; invite email sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Email already registered (CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/users/{userId}/suspend:
    post:
      tags: [admin]
      operationId: suspendUser
      summary: Suspend an account and revoke its sessions
      description: |
        Immediate effect (S1-16 AC 2): (1) identity calls Supabase's
        service-role Admin API to revoke the user's sessions and block new
        sign-ins; (2) the account status flips to SUSPENDED, and every request
        re-checks status after JWT validation — a not-yet-expired token from a
        suspended account is rejected at once, never waiting out the 1-hour
        JWT lifetime; (3) the user is notified by email (BRL-16, FR-87).
      security:
        - bearerAuth: []
      x-module: admin
      x-audit-event: user.suspended
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendRequest"
      responses:
        "200":
          description: User suspended; email notice sent (BRL-16, FR-87).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: User already suspended (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/users/{userId}/restore:
    post:
      tags: [admin]
      operationId: restoreUser
      summary: Restore a suspended account
      description: Clears the suspension, re-allows sign-in, and notifies the
        user by email. Access is restored even though any pre-suspension JWT
        was revoked — the user signs in again.
      security:
        - bearerAuth: []
      x-module: admin
      x-audit-event: user.restored
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: User restored; email notice sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: User is not suspended (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/listings/{propertyId}/suspend:
    post:
      tags: [admin]
      operationId: suspendListing
      summary: Suspend a published listing (moderation takedown)
      description: |
        S1-15-T3: "approve/reject/request-corrections/suspend/restore".
        Takes an ACTIVE listing down for cause (distinct from the owner's own
        PAUSED). Mandatory reason, owner notified (email + in-app), audited.
        A suspended property disappears from public reads (404, like any
        unpublished listing).
      security:
        - bearerAuth: []
      x-module: admin
      x-audit-event: listing.suspended
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendRequest"
      responses:
        "200":
          description: Listing suspended; owner notified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Listing is not published (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/listings/{propertyId}/restore:
    post:
      tags: [admin]
      operationId: restoreListing
      summary: Restore a suspended listing to published
      description: Returns a SUSPENDED listing to ACTIVE. Owner notified.
      security:
        - bearerAuth: []
      x-module: admin
      x-audit-event: listing.restored
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Listing restored; owner notified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Listing is not suspended (BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: getPlatformSettings
      summary: Read platform settings, policy version, and feature flags
      security:
        - bearerAuth: []
      x-module: admin
      responses:
        "200":
          description: Platform settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      operationId: updatePlatformSettings
      summary: Update platform settings, policy version, or feature flags
      description: Feature flags default to false in production (C7 dark launches).
      security:
        - bearerAuth: []
      x-module: admin
      x-audit-event: platform.setting_updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsUpdate"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/audit-logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      summary: Read the immutable audit trail (append-only, filterable)
      description: Read-only viewer for `audit.audit_log` (SCR-21C). Timestamps
        returned in UTC; the screen displays Ghana time.
      security:
        - bearerAuth: []
      x-module: admin
      parameters:
