            $ref: "#/components/schemas/UUID"
        - name: entityType
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: UTC start of the window (inclusive).
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: to
          in: query
          description: UTC end of the window (inclusive).
          schema:
            $ref: "#/components/schemas/Timestamp"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Audit log page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/properties/featured:
    get:
      tags: [listing-public]
      operationId: listFeaturedProperties
      summary: Featured published properties for the homepage (anonymous)
      security: []
      x-module: listing
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Featured property cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummaryList"

  /api/v1/properties/search:
    get:
      tags: [listing-public]
      operationId: searchProperties
      summary: Search published properties by destination, dates, guests, filters (anonymous)
      description: |
        Sprint 1 search filters by destination (town/area), stay dates (excludes
        owner-blocked units via `AvailabilityGate`), guests, accommodation type,
        and price range. Results show GHS price and the Verified Owner badge.
      security: []
      x-module: listing
      parameters:
        - name: destination
          in: query
          description: Town or area name (Ghana).
          schema:
            type: string
        - name: checkIn
          in: query
          description: First night, `YYYY-MM-DD` (Africa/Accra day).
          schema:
            type: string
            format: date
        - name: checkOut
          in: query
          description: Morning of departure, `YYYY-MM-DD` (Africa/Accra day).
          schema:
            type: string
            format: date
        - name: guests
          in: query
          schema:
            type: integer
            minimum: 1
        - name: accommodationType
          in: query
          schema:
            type: string
        - name: maxPricePesewas
          in: query
          description: Nightly rate ceiling in integer pesewas.
          schema:
            type: integer
            minimum: 0
        - name: minPricePesewas
          in: query
          description: Nightly rate floor in integer pesewas.
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          description: Result ordering (SCR-24 sort control). Default newest.
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching available properties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummaryList"
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/properties/{propertyId}:
    get:
      tags: [listing-public]
      operationId: getPropertyPublic
      summary: Published property details for guests (anonymous)
      description: Photos (WebP via CDN), GHS price range, facilities, house
        rules, location, and the Verified Owner badge. 404 when the property is
        unknown or not published.
      security: []
      x-module: listing
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyPublicDetail"
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued 1-hour access JWT (P-09). Verified by the API
        against Supabase JWKS (TA-08).

  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 20
    Limit:
      name: limit
      in: query
      description: Page size (default 20, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    UnreadOnly:
      name: unreadOnly
      in: query
      description: When true, return only unread entries (bell badge can pass
        limit=1 and still read unreadCount).
      schema:
        type: boolean
        default: false

  responses:
    Unauthenticated:
      description: Missing or invalid bearer JWT (UNAUTHENTICATED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated but not allowed (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource unknown, or belongs to another organisation (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Request body failed validation (VALIDATION_FAILED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Too many attempts (RATE_LIMITED, NFR-23).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    UUID:
      type: string
      format: uuid
      description: UUIDv7 identifier (T7 `IdGenerator`).
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC instant (`2026-11-17T09:30:00Z`). Screens
        display Africa/Accra (NFR-52).
    ApiError:
      type: object
      description: The one error shape (T7 shared kernel). `details` is omitted
        when empty. Clients switch on `code`, never on `message`.
      required: [code, message, status, timestamp, path]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, UNSUPPORTED_MEDIA_TYPE, BUSINESS_RULE_VIOLATION, RATE_LIMITED, INTERNAL_ERROR]
        message:
          type: string
        status:
          type: integer
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        path:
          type: string
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    RoleMembership:
      type: object
      description: A role the account holds, possibly scoped to an organisation
        or property (P-04, BRL-02).
      required: [role, organizationId]
      properties:
        role:
          type: string
          enum: [GUEST, OWNER, STAFF, ADMIN]
        organizationId:
          $ref: "#/components/schemas/UUID"
        organizationName: { type: string }
        propertyIds:
          description: Present (possibly empty) for STAFF — the properties the
            staff member may work on (UR-PS01).
          type: array
          items:
            $ref: "#/components/schemas/UUID"

    Profile:
      type: object
      required: [id, fullName, email, phone, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        fullName: { type: string }
        email: { type: string, format: email }
        phone:
          type: [string, "null"]
          description: Ghana phone number in E.164 (`+233…`), or null.
        avatarUrl:
          type: [string, "null"]
        preferredLanguage:
          type: [string, "null"]
          description: BCP-47 tag; `en` is the only supported value in R1
            (`user_profile.preferred_language`, S1-05).
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    ProfileUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        phone:
          type: [string, "null"]
          pattern: '^\+233\d{9}$'
        preferredLanguage:
          type: [string, "null"]
          description: BCP-47 tag; `en` only in R1.
        avatarUrl:
          type: [string, "null"]

    SessionContext:
      type: object
      description: |
        Everything the app needs after sign-in — profile, role memberships
        (drives the portal picker, SCR-06B), consent state, and the active
        organisation.
      required: [profile, memberships, consent]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/RoleMembership"
        consent:
          $ref: "#/components/schemas/ConsentState"
        activeOrganizationId:
          description: When the account belongs to exactly one organisation.
          type: [string, "null"]

    NotificationPreferences:
      type: object
      description: Per-channel opt-ins per notification kind. Kinds follow the
        T3 notification matrix (account, verification, listing decisions,
        account status). SMS honours P-08 (email-only fallback until the Ghana
        sender-ID is approved).
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, email, sms, inApp]
            properties:
              kind:
                type: string
                enum: [ACCOUNT, VERIFICATION, LISTING_DECISIONS, ACCOUNT_STATUS, MARKETING]
              email: { type: boolean }
              sms: { type: boolean }
              inApp: { type: boolean }

    Notification:
      type: object
      description: One in-app inbox entry, created by the NotificationSender
        when a domain event fires (P-08). Rows are per recipient; email/SMS
        attempts for the same event are logged in `notification_delivery`.
      required: [id, eventType, title, body, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType:
          type: string
          description: Template key from `notification_template` — e.g.
            VERIFICATION_APPROVED, LISTING_APPROVED, STAFF_INVITE.
        title: { type: string }
        body: { type: string }
        readAt:
          type: [string, "null"]
          format: date-time
        createdAt: { type: string, format: date-time }
        data:
          type: [object, "null"]
          description: Optional deep-link payload (e.g. propertyId,
            verificationCaseId) so the inbox can route on tap.

    NotificationPage:
      type: object
      description: Inbox page — the standard `{ items, total }` envelope (§4.8)
        plus `unreadCount` for the bell badge.
      required: [items, total, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }

    ConsentState:
      type: object
      description: |
        Latest privacy policy (Ghana Act 843) and the user's acceptance.
        An `acceptedAt` of null means the re-consent gate (SCR-06C) must
        show (NFR-36).
      required: [policyVersion, acceptedAt]
      properties:
        policyVersion: { type: string }
        policyUrl: { type: string }
        acceptedAt:
          type: [string, "null"]
          format: date-time

    ConsentAcceptance:
      type: object
      required: [policyVersion]
      properties:
        policyVersion:
          type: string
          description: The version being accepted — must match the latest.

    ConsentRecord:
      type: object
      required: [policyVersion, acceptedAt]
      properties:
        policyVersion: { type: string }
        acceptedAt: { $ref: "#/components/schemas/Timestamp" }

    Organization:
      type: object
      required: [id, name, verificationStatus, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        displayName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone:
          type: [string, "null"]
        verificationStatus:
          $ref: "#/components/schemas/VerificationOverallStatus"
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        displayName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone:
          type: [string, "null"]

    InvitationCreate:
      type: object
      required: [email, role, propertyIds]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [STAFF]
          description: R1 invites staff only (owners self-register organisations).
        propertyIds:
          type: array
          description: Properties the staff member is scoped to.
          items:
            $ref: "#/components/schemas/UUID"

    Invitation:
      type: object
      required: [id, email, role, status, expiresAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        email: { type: string, format: email }
        role: { type: string }
        propertyIds:
          type: array
          items:
            $ref: "#/components/schemas/UUID"
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
        expiresAt: { $ref: "#/components/schemas/Timestamp" }

    InvitationView:
      type: object
      description: What the acceptance screen shows before joining (SCR-08B).
      required: [organizationName, role, propertyNames, expiresAt]
      properties:
        organizationName: { type: string }
        role: { type: string }
        propertyNames:
          type: array
          items: { type: string }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }

    InvitationAccepted:
      type: object
      required: [organization, memberships]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/RoleMembership"

    OwnerDashboard:
      type: object
      description: KPI summary for SCR-07. Field set proposed for review
        (backend map §8, point 6).
      required: [verificationStatus, listingCounts, alerts]
      properties:
        verificationStatus:
          $ref: "#/components/schemas/VerificationOverallStatus"
        listingCounts:
          type: object
          required: [total, active, paused, pendingReview]
          properties:
            total: { type: integer }
            active: { type: integer }
            paused: { type: integer }
            pendingReview: { type: integer }
        alerts:
          type: array
          items:
            type: object
            required: [kind, message]
            properties:
              kind: { type: string }
              message: { type: string }

    VerificationOverallStatus:
      type: string
      enum: [NOT_SUBMITTED, PENDING, PARTIALLY_REJECTED, REJECTED, APPROVED]

    DocumentType:
      type: string
      enum: [GHANA_CARD, OWNERSHIP_PROOF, GTA_LICENCE]

    DocumentPresignRequest:
      type: object
      required: [documentType, contentType, sizeBytes]
      properties:
        documentType:
          $ref: "#/components/schemas/DocumentType"
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        sizeBytes:
          type: integer
          maximum: 5242880
          description: At most 5 MB (NFR-17, TA-13).

    PhotoPresignRequest:
      type: object
      required: [contentType, sizeBytes]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          maximum: 5242880

    PresignResponse:
      type: object
      required: [uploadUrl, expiresAt, objectKey]
      properties:
        uploadUrl:
          type: string
          description: Short-lived pre-signed PUT URL for R2.
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        objectKey: { type: string }
        photoId:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: |
            Photo presigns only: the photo row created at presign time. The
            browser uploads the bytes, then `PUT …/photos` (reorder + cover)
            commits it and `DELETE …/photos/{photoId}` removes it — there is
            no separate confirm call.

    VerificationSubmit:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          items:
            type: object
            required: [documentType, objectKey]
            properties:
              documentType:
                $ref: "#/components/schemas/DocumentType"
              objectKey: { type: string }
        ghanaCardNumberEncrypted:
          type: string
          description: Ghana Card number, client-encrypted per NFR-28/TA-09.
            Never returned by any endpoint.

    VerificationDocument:
      type: object
      required: [documentType, status]
      properties:
        documentType:
          $ref: "#/components/schemas/DocumentType"
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        fixNote:
          type: [string, "null"]
          description: Present when the document was rejected — what to fix.
        submittedAt:
          type: [string, "null"]
          format: date-time

    VerificationCase:
      type: object
      required: [status, documents]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status:
          $ref: "#/components/schemas/VerificationOverallStatus"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/VerificationDocument"
        submittedAt:
          type: [string, "null"]
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time

    ListingStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, CORRECTIONS_REQUESTED, ACTIVE, PAUSED, SUSPENDED, REJECTED]
      description: Draft → Pending Review → (Corrections Requested → edit →
        resubmit) → Active ⇄ Paused, or Rejected (FR-13, T3 SCR-13).
        SUSPENDED is the admin moderation takedown of a published listing
        (S1-15-T3) — restore returns it to ACTIVE; owners cannot set it.

    PropertyList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PropertySummary"
        total: { type: integer }

    PropertySummaryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PropertySummary"
        total: { type: integer }

    PropertySummary:
      type: object
      required: [id, name, town, accommodationType, status, coverPhotoUrl, fromPricePesewas]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        town: { type: string }
        area:
          type: [string, "null"]
        accommodationType: { type: string }
        status:
          $ref: "#/components/schemas/ListingStatus"
        coverPhotoUrl: { type: string }
        latitude:
          type: number
          description: Map pin (SCR-24 map view). WGS-84 decimal degrees.
        longitude:
          type: number
        fromPricePesewas:
          type: integer
          description: Lowest nightly rate across units, integer pesewas.
        currency:
          type: string
          const: GHS
        verifiedOwner: { type: boolean }

    PropertyCreate:
      type: object
      required: [name, accommodationType, town]
      properties:
        name: { type: string, minLength: 3 }
        description: { type: string }
        accommodationType: { type: string }
        town: { type: string }
        area:
          type: [string, "null"]
        address: { type: string }
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        amenities:
          type: array
          items: { type: string }
        houseRules: { type: string }

    PropertyUpdate:
      type: object
      description: Partial update; also carries the pause/reactivate switch.
      minProperties: 1
      properties:
        name: { type: string, minLength: 3 }
        description: { type: string }
        accommodationType: { type: string }
        town: { type: string }
        area:
          type: [string, "null"]
        address: { type: string }
        amenities:
          type: array
          items: { type: string }
        houseRules: { type: string }
        status:
          type: string
          enum: [PAUSED, ACTIVE]
          description: |
            Only these two transitions are allowed via PATCH (FR-13);
            submissions go through the /submit endpoint.

    PropertyDetail:
      type: object
      required: [id, name, accommodationType, town, status, units, photos, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description:
          type: [string, "null"]
        accommodationType: { type: string }
        town: { type: string }
        area:
          type: [string, "null"]
        address:
          type: [string, "null"]
        amenities:
          type: array
          items: { type: string }
        houseRules:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ListingStatus"
        units:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        correctionsRequested:
          type: array
          description: The fix list from the admin when status is CORRECTIONS_REQUESTED.
          items: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    PropertyPublicDetail:
      type: object
      required: [id, name, description, town, accommodationType, units, photos, fromPricePesewas, currency, verifiedOwner, houseRules, amenities]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        town: { type: string }
        area:
          type: [string, "null"]
        address: { type: string }
        latitude:
          type: number
          description: Map pin (WGS-84 decimal degrees).
        longitude:
          type: number
        accommodationType: { type: string }
        amenities:
          type: array
          items: { type: string }
        houseRules: { type: string }
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitPublic"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        fromPricePesewas:
          type: integer
          description: Lowest nightly rate, integer pesewas (250000 = GH₵2,500.00).
        currency:
          type: string
          const: GHS
        verifiedOwner:
          type: boolean
          description: Verified Owner badge (T3 SCR-25).

    Unit:
      type: object
      required: [id, name, ratePesewas, billingPeriod, maxGuests]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        category:
          type: [string, "null"]
          description: Optional unit grouping (P-02).
        ratePesewas:
          type: integer
          minimum: 0
          description: Rate in integer pesewas.
        currency:
          type: string
          const: GHS
        billingPeriod:
          type: string
          enum: [NIGHTLY]
          description: NIGHTLY is the only active billing period in R1
            (billing-period seam).
        maxGuests:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          description: Number of identical units this record represents.

    UnitPublic:
      type: object
      required: [id, name, ratePesewas, billingPeriod, maxGuests]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        category:
          type: [string, "null"]
        ratePesewas: { type: integer, minimum: 0 }
        currency:
          type: string
          const: GHS
        billingPeriod:
          type: string
          enum: [NIGHTLY]
        maxGuests: { type: integer, minimum: 1 }

    UnitInput:
      type: object
      required: [name, ratePesewas, billingPeriod, maxGuests]
      properties:
        name: { type: string, minLength: 1 }
        category:
          type: [string, "null"]
        ratePesewas: { type: integer, minimum: 0 }
        billingPeriod:
          type: string
          enum: [NIGHTLY]
        maxGuests: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, default: 1 }

    Photo:
      type: object
      required: [id, url, isCover]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        url:
          type: string
          description: Optimised WebP served via the Cloudflare CDN.
        isCover: { type: boolean }
        position: { type: integer }

    PhotoOrder:
      type: object
      required: [photoIds]
      properties:
        photoIds:
          type: array
          description: Complete photo id list in display order; the first is
            the cover photo.
          items:
            $ref: "#/components/schemas/UUID"

    AvailabilityCalendar:
      type: object
      required: [unitId, month, days]
      properties:
        unitId: { $ref: "#/components/schemas/UUID" }
        month: { type: string, examples: ["2026-11"] }
        days:
          type: array
          items:
            type: object
            required: [date, state]
            properties:
              date:
                type: string
                format: date
                description: Africa/Accra calendar day.
              state:
                type: string
                enum: [AVAILABLE, OWNER_BLOCKED]
                description: BOOKED arrives with Sprint 2 bookings.

    AvailabilityBlock:
      type: object
      required: [id, unitId, start, end, reason, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        unitId: { $ref: "#/components/schemas/UUID" }
        start: { $ref: "#/components/schemas/Timestamp" }
        end: { $ref: "#/components/schemas/Timestamp" }
        reason:
          type: string
          enum: [OWNER_BLOCK]
          description: HOLD and BOOKING reasons arrive via migration in
            Sprint 2 (availability seam).
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    AvailabilityBlockInput:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
          description: UTC instant for the first blocked night.
        end:
          type: string
          format: date-time
          description: UTC instant for the end of the block (must follow start).

    AdminDashboard:
      type: object
      description: KPI summary for SCR-18. Field set proposed for review
        (backend map §8, point 6).
      required: [pendingVerifications, pendingListings, totalUsers, suspendedUsers]
      properties:
        pendingVerifications: { type: integer }
        pendingListings: { type: integer }
        totalUsers: { type: integer }
        suspendedUsers: { type: integer }
        recentAlerts:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              message: { type: string }
              at: { $ref: "#/components/schemas/Timestamp" }

    ReviewQueueList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewQueueItem"
        total: { type: integer }

    ReviewQueueItem:
      type: object
      required: [id, kind, title, organisationName, submittedAt, status]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind:
          type: string
          enum: [VERIFICATION, LISTING]
        title: { type: string }
        organisationName: { type: string }
        submittedAt: { $ref: "#/components/schemas/Timestamp" }
        status:
          type: string
          enum: [PENDING, DECIDED]

    ReviewDetail:
      type: object
      required: [id, kind, status, submittedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind:
          type: string
          enum: [VERIFICATION, LISTING]
        status:
          type: string
          enum: [PENDING, APPROVED, CORRECTIONS_REQUESTED, REJECTED]
        organisationName: { type: string }
        submittedAt: { $ref: "#/components/schemas/Timestamp" }
        decidedAt:
          type: [string, "null"]
          format: date-time
        listing:
          $ref: "#/components/schemas/PropertyDetail"
        verificationCase:
          $ref: "#/components/schemas/VerificationCase"
        documentUrls:
          type: array
          description: Short-lived pre-signed GET URLs for verification
            documents (NFR-24) — present for VERIFICATION kinds.
          items:
            type: object
            properties:
              documentType:
                $ref: "#/components/schemas/DocumentType"
              url: { type: string }
              expiresAt: { $ref: "#/components/schemas/Timestamp" }

    ReviewDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REQUEST_CORRECTIONS, REJECT]
        corrections:
          type: array
          description: Required fix list — required when decision is
            REQUEST_CORRECTIONS.
          items: { type: string }
        rejectedDocumentTypes:
          type: array
          description: For per-document corrections on VERIFICATION kinds.
          items:
            $ref: "#/components/schemas/DocumentType"
        reason:
          type: string
          description: Required when decision is REJECT.

    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total: { type: integer }

    AdminUser:
      type: object
      required: [id, fullName, email, status, roles, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        fullName: { type: string }
        email: { type: string, format: email }
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        roles:
          type: array
          items: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        suspendedAt:
          type: [string, "null"]
          format: date-time

    SuspendRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3 }

    Member:
      type: object
      description: One organisation member with their role and property scope
        (`membership` + `membership_permission`, S1-07).
      required: [userId, fullName, email, role, propertyIds]
      properties:
        userId: { $ref: "#/components/schemas/UUID" }
        fullName: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [OWNER, STAFF]
          description: Org-level role (platform roles live in `identity`).
        propertyIds:
          type: array
          description: Properties this member may act on (empty for the owner).
          items:
            $ref: "#/components/schemas/UUID"
        joinedAt: { $ref: "#/components/schemas/Timestamp" }

    MemberList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total: { type: integer, minimum: 0 }

    MemberUpdate:
      type: object
      description: Replace-semantics update — `propertyIds` is the complete new
        scope (grant + revoke in one call, S1-07 AC 2).
      required: [role, propertyIds]
      properties:
        role:
          type: string
          enum: [STAFF]
          description: Only STAFF can be reassigned; the primary owner is fixed.
        propertyIds:
          type: array
          items:
            $ref: "#/components/schemas/UUID"

    InvitationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        total: { type: integer, minimum: 0 }

    AdminUserCreate:
      type: object
      description: Admin-provisioned account (S1-16-T3). Invite email is sent
        server-side via Supabase's service-role Admin API.
      required: [email, fullName, role, reason]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, minLength: 1 }
        role:
          type: string
          enum: [GUEST, OWNER, STAFF, ADMIN]
        reason: { type: string, minLength: 3 }

    PlatformSettings:
      type: object
      required: [settings, policyVersion]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/PlatformSetting"
        policyVersion: { type: string }

    PlatformSetting:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: string }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    PlatformSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        settings:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: { type: string }
        policyVersion: { type: string }

    AuditLogList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total: { type: integer }

    AuditLogEntry:
      type: object
      description: One append-only `audit.audit_log` row (BRL-13, NFR-66).
        Rendered read-only in SCR-21C with Ghana-time display.
      required: [id, actorId, orgId, action, entityType, entityId, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        actorId: { $ref: "#/components/schemas/UUID" }
        actorName: { type: string }
        orgId: { $ref: "#/components/schemas/UUID" }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { $ref: "#/components/schemas/Timestamp" }
