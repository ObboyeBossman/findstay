server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: findstay-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/findstay_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Subdomain & CORS Configuration
findstay:
  cors:
    allowed-origins:
      - "https://findstay.com"
      - "https://app.findstay.com"     # Student / Guest Portal
      - "https://host.findstay.com"    # Landlord / Property Portal
      - "https://admin.findstay.com"   # Admin Governance Portal
      - "http://localhost:5173"        # Local Frontend Development
      - "http://localhost:3000"
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:sk_test_findstay_dummy_secret_key}
    public-key: ${PAYSTACK_PUBLIC_KEY:pk_test_findstay_dummy_public_key}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:dummy_webhook_secret_for_hmac}
