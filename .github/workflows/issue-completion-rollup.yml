name: Issue Completion Guard & Story Roll-up (Retired — Manual Only)

# Retired on 2026-11-28 after migrating FindStay's live board from GitHub Issues / Project 5 to Trello.
# Kept manual-only (workflow_dispatch) for historical reference; do not re-enable automatic issue triggers.
on:
  workflow_dispatch:
    inputs:
      story_number:
        description: Legacy parent story issue number to inspect (e.g. 1)
        required: true
        default: '1'
        type: string

permissions:
  issues: write

jobs:
  completion-summary-and-rollup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce completion summary and update story roll-up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STORY_NUMBER: ${{ inputs.story_number }}
        run: node scripts/issue-completion-rollup.mjs
