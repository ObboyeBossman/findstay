  <text class="label" x="282" y="285">No</text><text class="label" x="250" y="290">Retry</text><text class="label" x="455" y="198">Yes</text>
  <text class="label" x="669" y="198">Yes</text><text class="label" x="584" y="283">No · optional session (Sprint 2+)</text><text class="label" x="650" y="267">R1: browse without account</text><text class="label" x="1178" y="198">Yes</text><text class="label" x="1098" y="283">No</text>
  <text class="label" x="1098" y="550">No / error</text><text class="label" x="950" y="420">Retry / change filters</text><text class="label" x="1100" y="420">Yes · matches</text>
