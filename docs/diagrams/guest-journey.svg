<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" preserveAspectRatio="xMinYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">FindStay Guest Journey</title>
  <desc id="desc">Guest flow from public browsing and property search in Release R1 to future Sprint 2+ account history and booking. Anonymous browsing is allowed; authentication cancellation returns to the property without creating an obligation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#a855f7"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#586579}.group-title{font-size:19px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.screen{fill:#dbeafe;stroke:#60a5fa;stroke-width:1.8}.future{fill:#faf5ff;stroke:#c084fc;stroke-width:1.8;stroke-dasharray:8 5}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.future-decision{fill:#faf5ff;stroke:#a855f7;stroke-width:1.8;stroke-dasharray:8 5}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.edge-blue{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow-blue)}.edge-orange{fill:none;stroke:#ea580c;stroke-width:2;marker-end:url(#arrow-orange)}.edge-future{fill:none;stroke:#a855f7;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow-purple)}.edge-green{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#arrow-green)}.label{font-size:12px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1920" height="1220" fill="#fff"/>
  <text class="title" x="40" y="48">FindStay — Guest Journey</text>
  <text class="subtitle" x="40" y="78">R1 public browsing · Sprint 2+ visitor history, account handoff, and booking are future scope</text>

  <rect x="40" y="110" width="1220" height="970" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="group-title" x="66" y="148">Release R1 — Public browsing</text>
  <rect x="1310" y="110" width="560" height="1165" rx="18" fill="#faf5ff" stroke="#a855f7" stroke-width="2" stroke-dasharray="10 6"/>
  <text class="group-title" x="1336" y="148" fill="#581c87">Sprint 2+ — Planned, not R1</text>

  <!-- Flow connectors, drawn before the nodes. -->
  <path class="edge" d="M225 209 H280"/><path class="edge-orange" d="M355 255 V310"/><path class="edge-orange" d="M280 344 H250 V209 H280"/><path class="edge" d="M430 209 H500"/>
  <path class="edge" d="M655 209 H745"/><path class="edge-future" d="M578 255 V310"/><path class="edge" d="M675 348 H710 V208 H745"/><path class="edge-blue" d="M578 255 V270 H720 V208 H745"/>
