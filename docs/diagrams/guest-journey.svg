  <path class="edge" d="M855 246 V440"/><path class="edge" d="M1092 528 V565"/><path class="edge-orange" d="M985 604 H900 V518"/><path class="edge-blue" d="M1092 430 V395 H850 V440"/><path class="edge-blue" d="M855 518 V690"/>
  <path class="edge" d="M855 768 V825"/><path class="edge" d="M965 853 H1015"/><path class="edge-orange" d="M1092 901 V930"/><path class="edge" d="M1005 962 H975 V729 H965"/><path class="edge-blue" d="M1015 853 H715 V735"/>
  <path class="edge" d="M465 735 H240"/><path class="edge-green" d="M162 680 V573"/><path class="edge" d="M240 728 H275"/><path class="edge" d="M352 690 V660 H855 V768"/>
  <path class="edge-future" d="M715 710 H1310 V211 H1465"/><path class="edge-future" d="M1580 242 V295"/><path class="edge-future" d="M1495 343 H1450 V430"/><path class="edge-future" d="M1660 343 H1697 V430"/>
  <path class="edge-future" d="M1445 462 H1320 V735 H465 V735"/><path class="edge-future" d="M1697 494 V525 H465 V735"/>
  <path class="edge-future" d="M240 750 H1300 V608 H1495"/><path class="edge-future" d="M1578 656 V720"/><path class="edge-future" d="M1495 768 H1455 V855"/><path class="edge-future" d="M1578 768 H1715 V985 H1695"/>
  <path class="edge-future" d="M1575 896 H1600"/><path class="edge-future" d="M1455 855 H1305 V735 H715"/><path class="edge-future" d="M1717 937 V985"/><path class="edge-future" d="M1580 1053 V1090"/><path class="edge-future" d="M1695 1121 H1760 V1019 H1695"/><path class="edge-future" d="M1580 1152 V1180"/>

  <!-- Main flow nodes. -->
  <ellipse cx="150" cy="209" rx="75" ry="29" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="body" text-anchor="middle" x="150" y="214" font-weight="700">Open FindStay</text>
  <polygon class="decision" points="355,163 430,209 355,255 280,209"/><text class="body" text-anchor="middle" x="355" y="204"><tspan x="355">Internet and service</tspan><tspan x="355" dy="18">reachable?</tspan></text>
  <rect x="280" y="310" width="170" height="68" rx="10" fill="#fff7ed" stroke="#fdba74"/><text class="body" text-anchor="middle" x="365" y="336"><tspan x="365">Offline / server error</tspan><tspan x="365" dy="19">Show retry message</tspan></text>
  <polygon class="decision" points="578,163 655,209 578,255 500,209"/><text class="body" text-anchor="middle" x="578" y="214">Signed in?</text>
  <rect class="future" x="485" y="310" width="190" height="75" rx="10"/><text class="body" text-anchor="middle" x="580" y="333"><tspan x="580">Optional first-party</tspan><tspan x="580" dy="18">visitor session · Sprint 2+</tspan><tspan x="580" dy="18">No account required</tspan></text>
  <rect class="screen" x="745" y="170" width="220" height="76" rx="10"/><text class="body" text-anchor="middle" x="855" y="199" font-weight="700"><tspan x="855">SCR-22 · Homepage</tspan><tspan x="855" dy="20">Browse / start search</tspan></text>
  <polygon class="decision" points="1092,163 1170,209 1092,255 1015,209"/><text class="body" text-anchor="middle" x="1092" y="204"><tspan x="1092">Published stays</tspan><tspan x="1092" dy="18">available?</tspan></text>
  <rect class="node" x="1005" y="310" width="175" height="65" rx="10"/><text class="body" text-anchor="middle" x="1092" y="337"><tspan x="1092">Empty state</tspan><tspan x="1092" dy="19">No stays listed yet</tspan></text>
  <rect class="screen" x="745" y="440" width="220" height="78" rx="10"/><text class="body" text-anchor="middle" x="855" y="469" font-weight="700"><tspan x="855">SCR-23 · Search stays</tspan><tspan x="855" dy="20">Place · dates · guests · filters</tspan></text>
  <polygon class="decision" points="1092,430 1170,479 1092,528 1015,479"/><text class="body" text-anchor="middle" x="1092" y="474"><tspan x="1092">Search succeeds</tspan><tspan x="1092" dy="18">with matches?</tspan></text>
  <rect x="985" y="565" width="230" height="78" rx="10" fill="#fff7ed" stroke="#fdba74"/><text class="body" text-anchor="middle" x="1100" y="592"><tspan x="1100">Network / 5xx: retry</tspan><tspan x="1100" dy="19">0 matches: empty state / filters</tspan></text>
  <rect class="screen" x="745" y="690" width="220" height="78" rx="10"/><text class="body" text-anchor="middle" x="855" y="719" font-weight="700"><tspan x="855">SCR-24 · Results</tspan><tspan x="855" dy="20">GHS · Verified Owner badge</tspan></text>
  <rect class="node" x="745" y="825" width="220" height="56" rx="10"/><text class="body" text-anchor="middle" x="855" y="860">Select a property</text>
  <polygon class="decision" points="1092,805 1170,853 1092,901 1015,853"/><text class="body" text-anchor="middle" x="1092" y="848"><tspan x="1092">Still published</tspan><tspan x="1092" dy="18">and found?</tspan></text>
  <rect class="node" x="1005" y="930" width="175" height="64" rx="10"/><text class="body" text-anchor="middle" x="1092" y="956"><tspan x="1092">SCR-29 · Not found</tspan><tspan x="1092" dy="18">Back to results</tspan></text>
  <rect class="screen" x="465" y="690" width="250" height="90" rx="10"/><text class="body" text-anchor="middle" x="590" y="714" font-weight="700"><tspan x="590">SCR-25 · Property details</tspan><tspan x="590" dy="18">Photos · location · facilities · GHS</tspan><tspan x="590" dy="18">Verified badge · Save/Share is Sprint 3</tspan></text>
  <polygon class="decision" points="162,680 240,728 162,776 85,728"/><text class="body" text-anchor="middle" x="162" y="733">Next action?</text>
  <ellipse cx="162" cy="544" rx="72" ry="29" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="body" text-anchor="middle" x="162" y="540" font-weight="700"><tspan x="162">Leave freely</tspan><tspan x="162" dy="17">No obligation</tspan></text>
  <rect class="node" x="275" y="690" width="155" height="62" rx="10"/><text class="body" text-anchor="middle" x="352" y="716"><tspan x="352">Continue browsing</tspan><tspan x="352" dy="18">Return to results</tspan></text>
  <rect x="70" y="860" width="330" height="112" rx="12" fill="#fffbeb" stroke="#f59e0b"/><text class="body" x="88" y="887"><tspan x="88">R1 ends at public browsing and viewing.</tspan><tspan x="88" dy="20">Visitors can leave at any time; browsing</tspan><tspan x="88" dy="20">creates no account, booking, or payment.</tspan></text>

  <!-- Future scope nodes. -->
  <rect class="future" x="1465" y="180" width="230" height="62" rx="10"/><text class="body" text-anchor="middle" x="1580" y="205"><tspan x="1580">Record recent view</tspan><tspan x="1580" dy="18">Sprint 2+</tspan></text>
  <polygon class="future-decision" points="1578,295 1660,343 1578,391 1495,343"/><text class="body" text-anchor="middle" x="1578" y="338"><tspan x="1578">View recent</tspan><tspan x="1578" dy="18">history?</tspan></text>
  <rect class="future" x="1350" y="430" width="190" height="64" rx="10"/><text class="body" text-anchor="middle" x="1445" y="456"><tspan x="1445">Temporary history</tspan><tspan x="1445" dy="18">This browser</tspan></text>
  <rect class="future" x="1580" y="430" width="235" height="64" rx="10"/><text class="body" text-anchor="middle" x="1697" y="456"><tspan x="1697">SCR-25A · Account history</tspan><tspan x="1697" dy="18">View / clear recent stays</tspan></text>
  <polygon class="future-decision" points="1578,560 1660,608 1578,656 1495,608"/><text class="body" text-anchor="middle" x="1578" y="613">Make a booking?</text>
  <polygon class="future-decision" points="1578,720 1660,768 1578,816 1495,768"/><text class="body" text-anchor="middle" x="1578" y="773">Signed in?</text>
  <rect class="future" x="1335" y="855" width="240" height="82" rx="10"/><text class="body" text-anchor="middle" x="1455" y="878"><tspan x="1455">Sign in / create account</tspan><tspan x="1455" dy="18">Preserve property + action</tspan><tspan x="1455" dy="18">Cancel returns to property</tspan></text>
  <rect class="future" x="1600" y="855" width="235" height="82" rx="10"/><text class="body" text-anchor="middle" x="1717" y="882"><tspan x="1717">Claim temporary history</tspan><tspan x="1717" dy="18">and resume intended action</tspan></text>
  <rect class="future" x="1465" y="985" width="230" height="68" rx="10"/><text class="body" text-anchor="middle" x="1580" y="1011" font-weight="700"><tspan x="1580">SCR-26 · Booking details</tspan><tspan x="1580" dy="19">Dates · guests · total GHS</tspan></text>
  <rect class="future" x="1465" y="1090" width="230" height="62" rx="10"/><text class="body" text-anchor="middle" x="1580" y="1115" font-weight="700"><tspan x="1580">SCR-27 · Confirm booking</tspan><tspan x="1580" dy="19">Conflict: revise dates</tspan></text>
  <rect class="future" x="1465" y="1180" width="230" height="58" rx="10"/><text class="body" text-anchor="middle" x="1580" y="1215" font-weight="700">SCR-28 · Booking confirmation</text>

