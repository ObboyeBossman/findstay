<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">FindStay System Architecture — Release R1</title>
  <desc id="desc">Approved target architecture showing the React web app, Supabase Auth, the Spring Boot modular monolith, Cloudflare R2, PostgreSQL, and transactional email. This is a contract view, not an implementation status report.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#db2777"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#586579}.group-title{font-size:19px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.module{font-size:14px;font-weight:600}.edge-label{font-size:12px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#fff"/>
  <text class="title" x="40" y="48">FindStay — System Architecture</text>
  <text class="subtitle" x="40" y="78">Target architecture contract · Release R1 · Approved design, not implementation completion</text>

  <!-- Connections are behind nodes for legibility. -->
  <path d="M430 340 H500" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="440" y="326">Business APIs · /api/v1</text>
  <path d="M328 280 H455 V112 H1390 V205" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="770" y="104">Auth only · supabase.auth.*</text>
  <path d="M1140 235 H1280" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="970" y="276">Validate Bearer JWT</text>
  <path d="M1140 415 H1280" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="855" y="365">Identity: invite / revoke</text>
  <path d="M1140 550 H1205 V590 H1280" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text class="edge-label" x="945" y="537">Media API · signed URLs</text>
  <path d="M430 488 H455 V684 H1400 V700" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-purple)"/>
  <text class="edge-label" x="520" y="660">Browser uploads directly to R2 using signed URL</text>
  <path d="M820 610 V730" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <text class="edge-label" x="836" y="714">Business data · OrgScope</text>
  <path d="M500 530 H465 V800 H405" fill="none" stroke="#db2777" stroke-width="2.5" marker-end="url(#arrow-pink)"/>
  <text class="edge-label" x="510" y="565">Notification module · transactional email</text>

  <!-- Web client -->
  <rect x="40" y="220" width="390" height="300" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text class="group-title" x="62" y="253">React Web App · Cloudflare Workers</text>
  <rect x="62" y="280" width="165" height="76" rx="10" fill="#fff" stroke="#bfdbfe"/>
  <text class="body" text-anchor="middle" x="144" y="311"><tspan x="144">Guest screens</tspan><tspan x="144" dy="20">Search · listing details</tspan></text>
  <rect x="242" y="280" width="165" height="76" rx="10" fill="#fff" stroke="#bfdbfe"/>
  <text class="body" text-anchor="middle" x="324" y="311"><tspan x="324">Auth screens</tspan><tspan x="324" dy="20">Sign-up · OTP · reset</tspan></text>
  <rect x="62" y="374" width="165" height="76" rx="10" fill="#fff" stroke="#bfdbfe"/>
  <text class="body" text-anchor="middle" x="144" y="405"><tspan x="144">Owner / Staff</tspan><tspan x="144" dy="20">Properties · availability</tspan></text>
  <rect x="242" y="374" width="165" height="76" rx="10" fill="#fff" stroke="#bfdbfe"/>
  <text class="body" text-anchor="middle" x="324" y="405"><tspan x="324">Admin screens</tspan><tspan x="324" dy="20">Reviews · platform ops</tspan></text>
  <text class="small" text-anchor="middle" x="235" y="489" fill="#1d4ed8" font-weight="700">Business data only through /api/v1</text>

  <!-- Target API boundary -->
  <rect x="500" y="140" width="640" height="470" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text class="group-title" x="524" y="174">Spring Boot 3 · Java 21 · Spring Modulith · Render · /api/v1</text>
  <g fill="#fff" stroke="#bbf7d0">
    <rect x="525" y="205" width="108" height="55" rx="9"/><rect x="645" y="205" width="108" height="55" rx="9"/><rect x="765" y="205" width="108" height="55" rx="9"/><rect x="885" y="205" width="108" height="55" rx="9"/><rect x="1005" y="205" width="108" height="55" rx="9"/>
    <rect x="575" y="285" width="108" height="55" rx="9"/><rect x="695" y="285" width="108" height="55" rx="9"/><rect x="815" y="285" width="108" height="55" rx="9"/><rect x="935" y="285" width="108" height="55" rx="9"/>
  </g>
  <g class="module" text-anchor="middle">
    <text x="579" y="239">identity</text><text x="699" y="239">organization</text><text x="819" y="239">verification</text><text x="939" y="239">listing</text><text x="1059" y="239">availability</text>
    <text x="629" y="319">media</text><text x="749" y="319">audit</text><text x="869" y="319">notification</text><text x="989" y="319">admin</text>
  </g>
  <rect x="555" y="380" width="530" height="56" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text class="module" text-anchor="middle" x="820" y="413" fill="#14532d">shared kernel · Money · Clock · OrgScope · events · jobs</text>
  <text class="small" text-anchor="middle" x="820" y="473" fill="#166534">Public module APIs and domain events · OrgScope on owner-scoped operations</text>

  <!-- Supabase -->
  <rect x="1260" y="145" width="290" height="300" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text class="group-title" x="1280" y="179">Supabase Auth · Auth only</text>
  <rect x="1280" y="205" width="250" height="78" rx="10" fill="#fff" stroke="#fed7aa"/>
  <text class="body" text-anchor="middle" x="1405" y="231"><tspan x="1405">supabase.auth.*</tspan><tspan x="1405" dy="19">Sign-up · OTP · reset</tspan><tspan x="1405" dy="19">Issues JWT + refresh token</tspan></text>
  <rect x="1280" y="300" width="250" height="58" rx="10" fill="#fff" stroke="#fed7aa"/>
  <text class="body" text-anchor="middle" x="1405" y="325"><tspan x="1405">JWKS endpoint</tspan><tspan x="1405" dy="19">API validates Bearer JWT</tspan></text>
  <rect x="1280" y="374" width="250" height="54" rx="10" fill="#fff" stroke="#fed7aa"/>
  <text class="body" text-anchor="middle" x="1405" y="396"><tspan x="1405">Admin API · service role</tspan><tspan x="1405" dy="18">Server-side invite / revoke only</tspan></text>

  <!-- Storage -->
  <rect x="1260" y="500" width="290" height="220" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text class="group-title" x="1280" y="534">Cloudflare R2</text>
  <rect x="1280" y="560" width="250" height="58" rx="10" fill="#fff" stroke="#ddd6fe"/>
  <text class="body" text-anchor="middle" x="1405" y="585"><tspan x="1405">Property images</tspan><tspan x="1405" dy="19">Public WebP · CDN</tspan></text>
  <rect x="1280" y="632" width="250" height="66" rx="10" fill="#fff" stroke="#ddd6fe"/>
  <text class="body" text-anchor="middle" x="1405" y="658"><tspan x="1405">Verification documents</tspan><tspan x="1405" dy="19">Private · short-lived signed URLs</tspan></text>

  <!-- Database and mail -->
  <rect x="500" y="730" width="640" height="160" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <text class="group-title" x="524" y="764">PostgreSQL 16 · Render · Flyway</text>
  <rect x="525" y="790" width="590" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="body" text-anchor="middle" x="820" y="815"><tspan x="820">One database · tables owned module by module</tspan><tspan x="820" dy="19">user_account · organization · verification_case · property · unit · rate_plan</tspan><tspan x="820" dy="19">availability_block · media_asset · audit_log · notification · platform_setting …</tspan></text>
  <rect x="55" y="745" width="350" height="110" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/>
  <text class="group-title" text-anchor="middle" x="230" y="790">Email provider</text>
  <text class="body" text-anchor="middle" x="230" y="818">Swappable adapter · P-08</text>

  <rect x="50" y="575" width="380" height="86" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="small" x="68" y="601"><tspan x="68">Trust boundaries: browser uses Supabase</tspan><tspan x="68" dy="18">for Auth only; business data goes through</tspan><tspan x="68" dy="18">the API. Browser never connects to PostgreSQL.</tspan></text>
</svg>